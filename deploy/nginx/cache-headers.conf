# Cache rules for the built frontend (the `current` release directory served by nginx).
# Include inside the `server { ... }` block that serves the app, next to the /api proxy.
#
# Hashed assets never change, so they are cached for a year. Everything that names them
# (index.html, the service worker, the manifest) must be revalidated on every load, otherwise a
# tab keeps loading chunks of the previous deploy.

# Matches the default deploy path of deploy.yml (FRONTEND_DEPLOY_PATH); change both together.
root /var/www/messenger/current;
index index.html;

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
}

location = /sw.js {
    add_header Cache-Control "no-cache" always;
}

location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
}

location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}