# Cache rules for the built frontend (the `current` release directory served by nginx).
# Include inside the `server { ... }` block that serves the app, next to the /api proxy.
#
# Hashed assets never change, so they are cached for a year. Everything that names them
# (index.html, the service worker, the manifest) must be revalidated on every load, otherwise a
# tab keeps loading chunks of the previous deploy.

# Matches the default deploy path of deploy.yml (FRONTEND_DEPLOY_PATH); change both together.
root /var/www/messenger/current;
index index.html;

location /assets/ {
    include /etc/nginx/snippets/messenger-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location = /index.html {
    include /etc/nginx/snippets/messenger-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location = /sw.js {
    include /etc/nginx/snippets/messenger-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location = /manifest.webmanifest {
    include /etc/nginx/snippets/messenger-security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location ~ "^/@(?<messenger_public_name>[A-Za-z0-9_]{3,32})/?$" {
    include /etc/nginx/snippets/messenger-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
    if ($messenger_link_preview_bot) {
        rewrite ^ /api/v2/og/names/$messenger_public_name last;
    }
    try_files /index.html =404;
}

location ~ "^/join/(?<messenger_invite_token>[A-Za-z0-9]{22})/?$" {
    include /etc/nginx/snippets/messenger-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex" always;
    if ($messenger_link_preview_bot) {
        rewrite ^ /api/v2/og/invites/$messenger_invite_token last;
    }
    try_files /index.html =404;
}

location / {
    include /etc/nginx/snippets/messenger-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}