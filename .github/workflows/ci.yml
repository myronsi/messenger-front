name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Pin is exact and matches the lockfile
        run: npm run check:contract
      - name: main only uses a stable contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:contract -- --stable
      - name: Generated types are up to date
        run: |
          npm run generate:api
          git diff --exit-code -- src/shared/api/generated
      - name: Lint, typecheck, test and build
        env:
          VITE_BASE_URL: https://example.invalid/api
        run: |
          # Share one install, but wait for every check and preserve any failure.
          npm run lint > lint.log 2>&1 & lint_pid=$!
          npm run typecheck > typecheck.log 2>&1 & typecheck_pid=$!
          npm test > test.log 2>&1 & test_pid=$!
          npm run build > build.log 2>&1 & build_pid=$!
          status=0
          for pid in "$lint_pid" "$typecheck_pid" "$test_pid" "$build_pid"; do
            wait "$pid" || status=1
          done
          for check in lint typecheck test build; do
            echo "::group::$check"
            cat "$check.log"
            echo "::endgroup::"
          done
          exit "$status"

  # Preserve existing required-check names while the work shares one installation.
  lint:
    needs: build
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Verify combined checks passed
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success

  typecheck:
    needs: build
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Verify combined checks passed
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success

  test:
    needs: build
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Verify combined checks passed
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success

  contract:
    needs: build
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Verify combined checks passed
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success

  # Real backend from Docker images: the version in scripts/backend-version on pull requests and
  # pushes, backend master nightly.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Start the backend
        run: bash scripts/backend-up.sh ${{ github.event_name == 'schedule' && 'master' || '' }}
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Backend logs
        if: failure()
        run: docker compose -f .backend-stack/compose.stack.yaml logs --tail 200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: smoke-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
