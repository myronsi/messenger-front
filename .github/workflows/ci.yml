name: CI

on:
  pull_request:
  push:
    branches: [main, v2]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api/v2

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test

  contract:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Pin is exact and matches the lockfile
        run: npm run check:contract
      - name: main only uses a stable contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:contract -- --stable
      - name: Regenerate the API layer
        run: npm run generate:api
      - name: Generated types are up to date
        run: git diff --exit-code -- src/shared/api/generated
      - run: npm run typecheck

  # Real backend from Docker images: the Go backend version in scripts/backend-version on pull requests
  # and pushes, the backend's go-master snapshot nightly.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # End-to-end against the Go backend: auth, direct and group chats, message actions, media, search and
    # reconnecting (e2e/smoke).
    env:
      E2E_API_URL: http://127.0.0.1:8080/api/v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Start the backend
        run: bash scripts/backend-up.sh ${{ github.event_name == 'schedule' && 'go-master' || '' }}
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:smoke
      - name: Backend logs
        if: failure()
        working-directory: .backend-stack/go
        run: |
          echo '::group::Warnings and errors'
          docker compose logs --no-color api worker | grep -E '"level":"(WARN|ERROR)"' || true
          echo '::endgroup::'
          docker compose logs --no-color --tail 200 api worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: smoke-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
