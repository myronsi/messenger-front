name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-artifact:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Package dist
        run: tar -czf messenger-front-${{ needs.release-please.outputs.tag_name }}-dist.tar.gz -C dist .
      - name: Attach dist to the GitHub Release
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" messenger-front-*-dist.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
