name: Deploy staging frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.messenger.viserix.com
    env:
      STAGING_ORIGIN: https://staging.messenger.viserix.com
      WEB_ROOT: /var/www/messenger-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run check:contract
      - name: Build for the staging API
        run: npm run build
        env:
          VITE_BASE_URL: https://staging.messenger.viserix.com/api/v2
          VITE_WS_URL: wss://staging.messenger.viserix.com/api/v2
          VITE_CLIENT_API_VERSION: ''
      - name: Configure staging SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" && -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_KNOWN_HOSTS" ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_deploy
          chmod 600 ~/.ssh/staging_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host staging\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/staging_deploy\n  StrictHostKeyChecking yes\n' "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
      - name: Upload and activate staging
        run: |
          set -euo pipefail
          tar -czf dist.tar.gz -C dist .
          ssh staging "mkdir -p '$WEB_ROOT/releases/sha-$GITHUB_SHA'"
          scp dist.tar.gz "staging:$WEB_ROOT/releases/sha-$GITHUB_SHA/dist.tar.gz"
          ssh staging "bash -s -- '$WEB_ROOT' '$GITHUB_SHA' '$STAGING_ORIGIN'" < deploy/activate-staging.sh
