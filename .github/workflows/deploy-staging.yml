name: Deploy staging frontend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.messenger.viserix.com
    env:
      STAGING_ORIGIN: https://staging.messenger.viserix.com
      WEB_ROOT: /var/www/messenger-staging
      DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run check:contract
      - name: Build for the staging API
        run: npm run build
        env:
          BUILD_COMMIT: ${{ env.DEPLOY_SHA }}
          VITE_BASE_URL: https://staging.messenger.viserix.com/api/v2
          VITE_WS_URL: wss://staging.messenger.viserix.com/api/v2
          VITE_CLIENT_API_VERSION: ''
      - name: Configure staging SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$SSH_KEY" && -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_KNOWN_HOSTS" ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_deploy
          chmod 600 ~/.ssh/staging_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host staging\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/staging_deploy\n  StrictHostKeyChecking yes\n' "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
      - name: Upload and activate staging
        run: |
          set -euo pipefail
          tar -czf dist.tar.gz -C dist .
          ssh staging "mkdir -p '$WEB_ROOT/incoming'"
          scp dist.tar.gz "staging:$WEB_ROOT/incoming/$DEPLOYMENT_ID.tar.gz"
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh staging "bash -s -- '$WEB_ROOT' '$DEPLOY_SHA' '$STAGING_ORIGIN' '$DEPLOYMENT_ID'" < deploy/activate-staging.sh
