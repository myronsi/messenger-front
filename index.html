<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Messenger</title>
    <meta name="description" content="Messenger" />
    <meta name="author" content="Me" />
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/pwa-64x64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Messenger" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script src="/boot.js"></script>
    <style>
      html { background: #ffffff; --boot-line: #f1f5f9; }
      html.dark { background: #11141d; --boot-line: #242c38; }
      body { margin: 0; }
      .boot-shell { display: none; }
      html[data-boot="app"] .boot-shell { display: flex; height: 100dvh; overflow: hidden; }
      .boot-rail { width: 64px; flex: none; border-right: 1px solid var(--boot-line); }
      .boot-list { width: clamp(280px, 25%, 420px); flex: none; padding: 64px 12px 0; border-right: 1px solid var(--boot-line); box-sizing: border-box; }
      .boot-row { display: flex; align-items: center; gap: 12px; height: 56px; }
      .boot-row i { width: 40px; height: 40px; border-radius: 50%; background: var(--boot-line); flex: none; }
      .boot-row b { height: 12px; flex: 1; border-radius: 6px; background: var(--boot-line); max-width: 70%; }
      .boot-chat { flex: 1; }
      @media (max-width: 767px) {
        .boot-rail, .boot-chat { display: none; }
        .boot-list { width: 100%; border-right: 0; }
      }
    </style>

    <meta property="og:title" content="Messenger" />
    <meta property="og:description" content="Messenger" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="" />
    <meta name="twitter:image" content="https://.png" />
  </head>

  <body>
    <div id="root"><div class="boot-shell" aria-hidden="true"><div class="boot-rail"></div><div class="boot-list"><div class="boot-row"><i></i><b></b></div><div class="boot-row"><i></i><b></b></div><div class="boot-row"><i></i><b></b></div><div class="boot-row"><i></i><b></b></div><div class="boot-row"><i></i><b></b></div><div class="boot-row"><i></i><b></b></div><div class="boot-row"><i></i><b></b></div><div class="boot-row"><i></i><b></b></div><div class="boot-row"><i></i><b></b></div></div><div class="boot-chat"></div></div></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
