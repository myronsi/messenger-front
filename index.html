<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Messenger</title>
    <meta name="description" content="Messenger" />
    <meta name="author" content="Me" />
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/pwa-64x64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Messenger" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script src="/boot.js"></script>
    <style>
      html { background: #ffffff; --boot-spinner: #94a3b8; }
      html.dark { background: #11141d; --boot-spinner: #64748b; }
      body { margin: 0; }
      .boot-shell { display: none; }
      html[data-boot="app"] .boot-shell { display: flex; height: 100dvh; align-items: center; justify-content: center; }
      .boot-spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--boot-spinner); border-top-color: transparent; opacity: 0; animation: boot-show 0s linear 300ms forwards, boot-spin 0.8s linear infinite; }
      @keyframes boot-show { to { opacity: 1; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>

    <meta property="og:title" content="Messenger" />
    <meta property="og:description" content="Messenger" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="" />
    <meta name="twitter:image" content="https://.png" />
  </head>

  <body>
    <div id="root"><div class="boot-shell" aria-hidden="true"><div class="boot-spinner"></div></div></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
